server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Serve static files
    location /static/ {
        alias /app/resources/static/;  # Path inside the Nginx container
        expires 1y;
        add_header Cache-Control "public";
    }

    # Serve media files
    location /media/ {
        alias /app/resources/media/;  # Path inside the Nginx container
        expires 1y;
        add_header Cache-Control "public";
    }

    # Proxy requests to Gunicorn
    location / {
        proxy_pass http://web:8069;  # Gunicorn or another WSGI server
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        root /path/to/your/project/resources/static/;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /path/to/your/project/resources/static/;
    }
}

services:
  web:
    volumes:
      - ./resources/static:/app/resources/static
      - ./resources/media:/app/resources/media

  nginx:
    volumes:
      - ./resources/static:/app/resources/static
      - ./resources/media:/app/resources/media