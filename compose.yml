networks:
  app_network:
    driver: bridge

services:

  web:
    restart: always
    env_file:
      - .env
    build:
      context: .
      dockerfile: resources/deployments/web/Dockerfile
    ports:
      - "8069:8000"
    depends_on:
      - pgbouncer
    networks:
      - app_network
    volumes:
      - ./resources/media/:/app/resources/media

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    restart: always
    environment:
      - DATABASES_AUTH_USER=${POSTGRES_USER}
      - DATABASES_CLIENT_SIDE_DBNAME=${POSTGRES_DB}
      - DATABASES_USER=${POSTGRES_USER}
      - DATABASES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASES_DBNAME=${POSTGRES_DB}
      - DATABASES_HOST=${POSTGRES_HOST}
      - DATABASES_PORT=${POSTGRES_PORT:-5432}
      - PGBOUNCER_DEFAULT_POOL_SIZE=100
      - PGBOUNCER_MAX_CLIENT_CONN=10000
      - PGBOUNCER_LISTEN_PORT=${POSTGRES_BOUNCER_PORT:-6432}
      - PGBOUNCER_LISTEN_ADDR=*
      - PGBOUNCER_LOGFILE=/var/log/pgbouncer/pgbouncer.log
    volumes:
      - pgbouncer_data:/etc/pgbouncer
    ports:
      - ${POSTGRES_BOUNCER_PORT:-6432}:6432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/psqldb/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  pgbouncer_data:
  pgdata:
